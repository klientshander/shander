    --cream: #f6faf2;

    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: #191c21;

    position: relative;
    overflow-x: hidden;

    image-rendering: pixelated;
    shape-rendering: crispEdges;
  }

    background-position: center bottom;
    background-repeat: no-repeat;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    opacity: 1;
    animation: bgZoom 14s ease-in-out infinite alternate;
    transform-origin: center center;
    transition: opacity 0.3s ease;
    will-change: transform;
  }

  @keyframes bgZoom {
    0% {
      transform: scale(1.0);
    }
    50% {
      transform: scale(1.22);
    }
    100% {
      transform: scale(1.0);
    }
  }

  /* Drifting Adventure Time Pixel Leaves */
  .bg-leaves {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
  }

  .pixel-leaf {
    position: absolute;
    top: -24px;
    opacity: 0;
    pointer-events: none;
    animation: leafFall linear infinite;
  }

  @keyframes leafFall {
    0% {
      transform: translate3d(0, 0, 0) rotate(0deg);
      opacity: 0;
    }
    10% {
      opacity: 0.85;
    }
    85% {
      opacity: 0.85;
    }
    100% {
      transform: translate3d(var(--dx), 108vh, 0) rotate(var(--rot));
      opacity: 0;
    }
  }

  .bg-video {
    position: absolute;
    inset: -60px;
    width: calc(100% + 120px);
    height: calc(100% + 120px);
    object-fit: cover;
    image-rendering: pixelated;
    opacity: 0;
    animation: bgZoom 14s ease-in-out infinite alternate;
    transform-origin: center center;
    transition: opacity 0.3s ease;
    will-change: transform;
  }

  .bg-overlay {
    position: absolute;
    inset: 0;
    background: rgba(18, 14, 28, 0.15);
    pointer-events: none;
    transition: background 0.3s ease;
  }

  /* Background modes */
  .bg-container.mode-treehouse .bg-image {
    opacity: 1;
  }
  .bg-container.mode-treehouse .bg-video {
    opacity: 0;
  }

  .bg-container.mode-video .bg-image {
    opacity: 0;
  }
  .bg-container.mode-video .bg-video {
    opacity: 1;
  }

  .bg-container.mode-mint .bg-image,
  .bg-container.mode-mint .bg-video {
    opacity: 0;
  }
  .bg-container.mode-mint .bg-overlay {
    background: var(--mint);
    opacity: 1;
  }

  /* Compact Player App Frame */
  .app {
    width: 100%;
    max-width: 350px; /* Compact Default */
    position: relative;
    z-index: 10;
    transition: max-width 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  /* Top Bar */
  .titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    gap: 6px;
  }

  .titlebar-brand {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.50rem;
    color: var(--dark);
    display: flex;
    align-items: center;
    gap: 5px;
    letter-spacing: 0.3px;
    background: rgba(246, 250, 242, 0.94);
    padding: 4px 6px;
    border: 2px solid var(--dark);
    box-shadow: 2px 2px 0 var(--dark);
    white-space: nowrap;
  }

  .titlebar-brand svg {
    width: 16px;
    height: 14px;
  }

  .titlebar-actions {
    display: flex;
    gap: 4px;
  }

  .sheet-toggle-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.42rem;
    padding: 4px 6px;
    background: var(--cream);
    border: 2px solid var(--dark);
    box-shadow: 2px 2px 0 var(--dark);
    color: var(--dark);
    cursor: pointer;
    transition: transform 0.05s ease, background 0.1s ease;
    white-space: nowrap;
  }

  .sheet-toggle-btn:hover {
    background: var(--blue-pale);
  }

  .sheet-toggle-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 var(--dark);
  }

  .sheet-toggle-btn.active {
    background: var(--blue);
    color: var(--white);
  }

  /* Player Card */
  .player {
    background: rgba(246, 250, 242, 0.96);
    backdrop-filter: blur(4px);
    border: 3px solid var(--dark);
    box-shadow: 4px 4px 0 var(--dark);
    padding: 12px;
    position: relative;
  }

  /* Stage selector tabs — 100% pixel icons, NO EMOJIS! */
  .stage-tabs {
    display: flex;
    gap: 2px;
    margin-bottom: 8px;
  }

  .tab-btn {
    flex: 1;
    font-family: 'Press Start 2P', monospace;
    font-size: 0.34rem;
    padding: 4px 1px;
    background: var(--mint);
    border: 2px solid var(--dark);
    color: var(--dark);
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    transition: background 0.1s ease;
  }

  .tab-btn:hover {
    background: var(--blue-pale);
  }

  .tab-btn.active {
    background: var(--blue);
    color: var(--white);
    border-color: var(--dark);
  }

  .tab-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 11px;
    height: 11px;
    flex-shrink: 0;
  }

  .tab-icon svg {
    max-width: 100%;
    max-height: 100%;
    image-rendering: pixelated;
  }

  /* Hero Display Stage */
  .art-wrap {
    width: 100%;
    aspect-ratio: 16 / 10;
    max-height: 170px;
    background: var(--mint);
    border: 3px solid var(--dark);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    margin-bottom: 10px;
  }

  .hero-canvas {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .hero-canvas svg {
    max-width: 82%;
    max-height: 82%;
    filter: drop-shadow(0 3px 0 rgba(54, 32, 58, 0.18));
    transition: transform 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  /* Hero Stage Video Player (Finn, Jake & BMO Loop) */
  .hero-video-wrap {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  .hero-video-player {
    width: 100%;
    height: 100%;
    object-fit: cover;
    image-rendering: pixelated;
  }

  .hero-video-badge {
    position: absolute;
    top: 6px;
    right: 6px;
    font-family: 'Press Start 2P', monospace;
    font-size: 0.38rem;
    background: rgba(246, 250, 242, 0.92);
    border: 2px solid var(--dark);
    padding: 2px 5px;
    color: var(--dark);
    pointer-events: none;
    z-index: 5;
  }

  /* BIG PIXEL LYRICS OVERLAY BANNER */
  .stage-lyric-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 8px 10px 10px;
    background: rgba(36, 20, 39, 0.92);
    border-top: 3px solid var(--dark);
    text-align: center;
    z-index: 15;
    pointer-events: none;
    box-shadow: 0 -4px 0 rgba(0, 0, 0, 0.30);
    display: none;
  }

  .stage-lyric-bar.visible {
    display: block;
    animation: lyricSlideUp 0.25s ease-out;
  }

  @keyframes lyricSlideUp {
    0% { transform: translateY(100%); }
    100% { transform: translateY(0); }
  }

  .stage-lyric-text {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.92rem; /* BIG BOLD RETRO PIXEL FONT */
    color: #ffffff;
    text-shadow: 2px 2px 0 #000000, -2px -2px 0 #000000, 2px -2px 0 #000000, -2px 2px 0 #000000, 0 3px 0 rgba(0, 0, 0, 0.85);
    line-height: 1.5;
    letter-spacing: 0.5px;
    display: block;
    image-rendering: pixelated;
    transition: transform 0.15s ease, color 0.15s ease;
  }

  /* DEDICATED FULL KARAOKE LYRICS STAGE */
  .lyrics-stage-wrap {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 14px;
    text-align: center;
    background: radial-gradient(circle at center, #deedd6 0%, #cbdcc2 100%);
    position: relative;
    box-sizing: border-box;
  }

  .lyrics-prev-line {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.52rem;
    color: var(--blue);
    opacity: 0.70;
    margin-bottom: 8px;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 95%;
  }

  .lyrics-current-line {
    font-family: 'Press Start 2P', monospace;
    font-size: 1.05rem; /* BIG BOLD RETRO PIXEL HIGHLIGHT */
    color: var(--dark);
    text-shadow: 2px 2px 0 #ffffff;
    line-height: 1.5;
    margin-bottom: 8px;
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.90);
    border: 2px solid var(--dark);
    box-shadow: 3px 3px 0 var(--dark);
    max-width: 96%;
    animation: lyricPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    word-break: break-word;
  }

  @keyframes lyricPop {
    0% { transform: scale(0.92); opacity: 0.7; }
    50% { transform: scale(1.04); }
    100% { transform: scale(1); opacity: 1; }
  }

  .lyrics-next-line {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.52rem;
    color: var(--dark);
    opacity: 0.55;
    margin-top: 4px;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 95%;
  }

  .lyrics-badge {
    position: absolute;
    top: 6px;
    right: 6px;
    font-family: 'Press Start 2P', monospace;
    font-size: 0.36rem;
    background: var(--cream);
    border: 2px solid var(--dark);
    padding: 2px 5px;
    color: var(--dark);
    pointer-events: none;
  }

  /* Animations when audio is playing */
  .art-wrap.is-playing .boombox-hero {
    animation: boombox-bounce 0.48s ease-in-out infinite alternate;
  }

  @keyframes boombox-bounce {
    0% { transform: translateY(0) scale(1); }
    100% { transform: translateY(-4px) scale(1.02); }
  }

    animation: headphones-beat 0.5s ease-in-out infinite alternate;

    user-select: none;
    position: relative;

  .popcat-frame {
    max-width: 85%;
    max-height: 85%;

    filter: drop-shadow(0 4px 0 rgba(54, 32, 58, 0.22));
    transition: transform 0.05s ease;

    position: absolute;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .floating-note svg {
    width: 14px;
    height: 16px;
  }

  .art-wrap.is-playing .floating-note {
    opacity: 0.9;
  }

  .art-wrap.is-playing .floating-note-1 {
    left: 8px;
    bottom: 12px;
    animation: floatUp 1.9s ease-in-out infinite;
  }

  .art-wrap.is-playing .floating-note-2 {
    right: 10px;
    bottom: 16px;
    animation: floatUp 2.3s ease-in-out 0.8s infinite;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 0.9; }
    100% { transform: translateY(-50px) rotate(15deg); opacity: 0; }

    top: 0; left: 0; bottom: 0;

    transform: translate(2px, 2px);
    box-shadow: 0 0 0 var(--dark);

    width: 34px;
    height: 34px;

    height: 16px;

    height: 48px;

    align-items: center;

    background: transparent;
    border: none;
    padding: 0;

      const delay = Math.random() * 16;
      const dx = (Math.random() * 160 - 80).toFixed(0) + 'px';
      const rot = (Math.random() * 720 - 360).toFixed(0) + 'deg';
      leaf.style.setProperty('--dx', dx);
      leaf.style.setProperty('--rot', rot);
      leaf.style.animationDuration = `${dur}s`;
      leaf.style.animationDelay = `${delay}s`;
      leavesContainer.appendChild(leaf);
    }
  }

  // Popcat mouth trigger
  let popTimeout = null;
  function triggerPopcatMouth(withSound = true) {
    const closed = document.getElementById('popcatClosedSvg');
    const open = document.getElementById('popcatOpenSvg');
    const badge = document.getElementById('popBadge');

    if (closed && open) {
      closed.style.display = 'none';
      open.style.display = 'block';

      if (withSound) playPopSound();

      popCount++;
      if (badge) badge.textContent = `POPS: ${popCount}`;

      if (popTimeout) clearTimeout(popTimeout);
      popTimeout = setTimeout(() => {
        closed.style.display = 'block';
        open.style.display = 'none';
      }, 120);
    }
  }

  // Synchronized Lyrics Engine
  function updateLyrics(time) {
    if (currentTrackIdx !== 0) {
      if (stageLyricBar) stageLyricBar.classList.remove('visible');
      return;
    }

    let idx = 0;
    for (let i = 0; i < ISLAND_SONG_LYRICS.length; i++) {
      if (time >= ISLAND_SONG_LYRICS[i].time) {
        idx = i;
      } else {
        break;
      }
    }

    const cur = ISLAND_SONG_LYRICS[idx];
    const prev = idx > 0 ? ISLAND_SONG_LYRICS[idx - 1] : { text: "" };
    const next = idx < ISLAND_SONG_LYRICS.length - 1 ? ISLAND_SONG_LYRICS[idx + 1] : { text: "" };

    // Update floating stage banner
    if (stageLyricBar && stageLyricText) {
      if (showLyricsOverlay && activeStage !== 'lyrics') {
        stageLyricBar.classList.add('visible');
      } else {
        stageLyricBar.classList.remove('visible');
      }
      if (idx !== currentLyricIdx) {
        stageLyricText.textContent = cur.text;
      }
    }

    // Update dedicated lyrics stage if active
    if (activeStage === 'lyrics') {
      const curElem = document.getElementById('lyricsCurrentLine');
      const prevElem = document.getElementById('lyricsPrevLine');
      const nextElem = document.getElementById('lyricsNextLine');
      if (curElem && idx !== currentLyricIdx) {
        curElem.textContent = cur.text;
        if (prevElem) prevElem.textContent = prev.text || "...";
        if (nextElem) nextElem.textContent = next.text || "...";
      }
    }

    currentLyricIdx = idx;
  }

  // Render Hero Stage Art
  function renderHeroArt() {
    const s = SIZES[activeStage] || SIZES['boombox'];
    let content = '';

    if (activeStage === 'boombox') {
      content = `<svg class="boombox-hero" viewBox="0 0 ${s.w} ${s.h}">${SPRITES.boombox}</svg>`;
    } else if (activeStage === 'cassette') {
      content = `<svg class="cassette-hero" viewBox="0 0 ${s.w} ${s.h}">${SPRITES.cassette}</svg>`;
    } else if (activeStage === 'headphones') {
      content = `<svg class="headphones-hero" viewBox="0 0 ${s.w} ${s.h}">${SPRITES.headphones}</svg>`;
    } else if (activeStage === 'equalizer') {
      content = `<svg class="equalizer-hero" id="eqHeroSvg" viewBox="0 0 ${s.w} ${s.h}">${SPRITES.equalizer}</svg>`;
    } else if (activeStage === 'cat') {
      content = `
        <div class="popcat-hero-wrap" id="popcatHero" title="Click to POP!">
          <div class="pop-hint-badge" id="popBadge">POPS: ${popCount}</div>
          <svg class="popcat-frame" id="popcatClosedSvg" viewBox="0 0 ${SIZES.popcat_closed.w} ${SIZES.popcat_closed.h}">
            ${SPRITES.popcat_closed}
          </svg>
          <svg class="popcat-frame" id="popcatOpenSvg" viewBox="0 0 ${SIZES.popcat_open.w} ${SIZES.popcat_open.h}" style="display:none;">
            ${SPRITES.popcat_open}
          </svg>
        </div>
      `;
    } else if (activeStage === 'chill') {
      content = `
        <div class="hero-video-wrap">
          <video class="hero-video-player" autoplay loop muted playsinline>
            <source src="adventure_chill_loop.mp4" type="video/mp4">
            <source src="From%20Klickpin.com-%20Try%20these%2032%20Modern%20fall%20outfit%20ideas%20for%20women%20that%20are%20perfect%20when%20you%20want%20something%20stylish%20modern%20and%20easy%20to%20copy%20for%20an.mp4" type="video/mp4">
          </video>
          <div class="hero-video-badge">FINN, JAKE & BMO</div>
        </div>
      `;
    } else if (activeStage === 'lyrics') {
      content = `
        <div class="lyrics-stage-wrap">
          <div class="lyrics-badge">KARAOKE STAGE</div>
          <div class="lyrics-prev-line" id="lyricsPrevLine">...</div>
          <div class="lyrics-current-line" id="lyricsCurrentLine">♫ (COME ALONG WITH ME) ♫</div>
          <div class="lyrics-next-line" id="lyricsNextLine">...</div>
        </div>
      `;
    }

    heroCanvas.innerHTML = content;

    const heroVid = heroCanvas.querySelector('video');
    if (heroVid) {
      heroVid.play().catch(() => {});
    }

    const catHero = document.getElementById('popcatHero');
    if (catHero) {
      catHero.addEventListener('click', () => triggerPopcatMouth(true));
    }

    currentLyricIdx = -1;
    updateLyrics(currentTime);
  }

  function updatePlayButtonUI() {
    const key = isPlaying ? 'pause_button' : 'play_button';
    const s = SIZES[key];
    playIcon.innerHTML = `<svg viewBox="0 0 ${s.w} ${s.h}">${SPRITES[key]}</svg>`;
    playBtn.setAttribute('aria-pressed', String(isPlaying));
    artWrap.classList.toggle('is-playing', isPlaying);
  }

  function updateSpeakerUI() {
    const key = isMuted || volume === 0 ? 'speaker_mute' : 'speaker';
    const s = SIZES[key];
    speakerIcon.innerHTML = `<svg viewBox="0 0 ${s.w} ${s.h}">${SPRITES[key]}</svg>`;
  }

  function renderPlaylist() {
    playlistElem.innerHTML = '';
    TRACKS.forEach((track, i) => {
      const li = document.createElement('li');
      li.className = `track-row ${i === currentTrackIdx ? 'playing' : ''}`;
      const iconKey = track.icon;
      const s = SIZES[iconKey] || SIZES['cassette'];

      li.innerHTML = `
        <div class="row-slot">
          <svg viewBox="0 0 ${s.w} ${s.h}">${SPRITES[iconKey] || SPRITES['cassette']}</svg>
        </div>
        <div class="row-info">
          <span class="row-name">${track.title}</span>
          <span class="row-desc">${track.artist}</span>
        </div>
        <span class="row-dur">${track.duration > 0 ? fmtTime(track.duration) : '--:--'}</span>
      `;

      li.addEventListener('click', () => {
        if (track.isCustom) {
          audioFileInput.click();
        } else {
          loadTrack(i, true);
        }
      });

      playlistElem.appendChild(li);
    });
  }

  // File Input Handler
  audioFileInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    const fileUrl = URL.createObjectURL(file);
    const customTrack = TRACKS[TRACKS.length - 1];
    customTrack.title = file.name.replace(/\.[^/.]+$/, "");
    customTrack.artist = "Local Audio File";
    customTrack.duration = 0;

    customAudioElem.src = fileUrl;
    customAudioElem.onloadedmetadata = () => {
      customTrack.duration = Math.round(customAudioElem.duration);
      timeTotal.textContent = fmtTime(customTrack.duration);
      renderPlaylist();
    };

    customAudioElem.onended = () => {
      if (isRepeat) {
        customAudioElem.currentTime = 0;
        customAudioElem.play();
      } else {
        goRelative(1);
      }
    };

    loadTrack(TRACKS.length - 1, true);
  });

  // Chiptune Synthesizer
  function startSynthEngine(track) {
    stopSynthEngine();
    if (!audioCtx) return;

    const bpm = track.bpm || 120;
    const intervalMs = (60 / bpm / 2) * 1000;
    let step = 0;

    synthInterval = setInterval(() => {
      if (!isPlaying) return;

      const t = audioCtx.currentTime;

      // Popcat beat sync
      if (track.isPopcatTrack && activeStage === 'cat') {
        if (step % 2 === 0) {
          triggerPopcatMouth(false);
        }
      }

      // Melody Lead
      const noteIdx = track.arpPattern[step % track.arpPattern.length];
      const freq = track.scale[noteIdx % track.scale.length];

      const osc = audioCtx.createOscillator();
      const noteGain = audioCtx.createGain();

      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, t);

      noteGain.gain.setValueAtTime(0.12, t);
      noteGain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);

      osc.connect(noteGain);
      noteGain.connect(analyserNode);
      noteGain.connect(gainNode);

      osc.start(t);
      osc.stop(t + 0.24);

      // Bassline
      if (step % 4 === 0) {
        const bassOsc = audioCtx.createOscillator();
        const bassGain = audioCtx.createGain();
        const bassFreq = track.bassPattern[(Math.floor(step / 4)) % track.bassPattern.length];
        bassOsc.type = 'triangle';
        bassOsc.frequency.setValueAtTime(bassFreq, t);

        bassGain.gain.setValueAtTime(0.18, t);
        bassGain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);

        bassOsc.connect(bassGain);
        bassGain.connect(analyserNode);
        bassGain.connect(gainNode);

        bassOsc.start(t);
        bassOsc.stop(t + 0.38);
      }

      // Snare / Noise burst
      if (step % 8 === 4) {
        const bufferSize = audioCtx.sampleRate * 0.05;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let j = 0; j < bufferSize; j++) {
          data[j] = Math.random() * 2 - 1;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.07, t);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);

        noise.connect(noiseGain);
        noiseGain.connect(analyserNode);
        noiseGain.connect(gainNode);

        noise.start(t);
      }

      step++;
    }, intervalMs);
  }

  function stopSynthEngine() {
    if (synthInterval) {
      clearInterval(synthInterval);
      synthInterval = null;
    }
  }

  function loadTrack(idx, autoPlay = true) {
    currentTrackIdx = idx;
    const track = TRACKS[idx];

    trackTitle.textContent = track.title;
    trackArtist.textContent = track.artist;
    trackMode.textContent = track.genre;
    currentTime = 0;
    timeCurrent.textContent = '0:00';
    timeTotal.textContent = track.duration > 0 ? fmtTime(track.duration) : '--:--';
    seekFill.style.width = '0%';
    seekBar.setAttribute('aria-valuenow', '0');

    if (track.audioSrc) {
      customAudioElem.src = track.audioSrc;
      customAudioElem.load();
      customAudioElem.onloadedmetadata = () => {
        if (customAudioElem.duration && !isNaN(customAudioElem.duration)) {
          track.duration = Math.round(customAudioElem.duration);
          timeTotal.textContent = fmtTime(track.duration);
        }
      };
      customAudioElem.onended = () => {
        if (isRepeat) {
          customAudioElem.currentTime = 0;
          customAudioElem.play();
        } else {
          goRelative(1);
        }
      };
      customAudioElem.onerror = () => {
        if (track.altSrc && !customAudioElem.src.includes(encodeURIComponent(track.altSrc))) {
          customAudioElem.src = track.altSrc;
          customAudioElem.load();
          if (isPlaying) customAudioElem.play().catch(() => {});
        }
      };
    } else if (!track.isCustom) {
      customAudioElem.pause();
      customAudioElem.src = '';
    }

    if (track.autoStage) {
      switchStage(track.autoStage);
    }

    renderPlaylist();
    currentLyricIdx = -1;
    updateLyrics(0);

    if (autoPlay) {
      play();
    } else {
      pause();
    }
  }

  function play() {
    initAudioContext();
    isPlaying = true;
    updatePlayButtonUI();

    const track = TRACKS[currentTrackIdx];
    if (track.audioSrc || (track.isCustom && customAudioElem.src)) {
      stopSynthEngine();
      customAudioElem.play().catch(() => {});
    } else {
      customAudioElem.pause();
      startSynthEngine(track);
    }

    startProgressTimer();
  }

  function pause() {
    isPlaying = false;
    updatePlayButtonUI();
    stopSynthEngine();
    customAudioElem.pause();
    stopProgressTimer();
  }

  function togglePlay() {
    if (isPlaying) {
      pause();
    } else {
      play();
    }
  }

  function startProgressTimer() {
    stopProgressTimer();
    trackTimer = setInterval(() => {
      const track = TRACKS[currentTrackIdx];
      const dur = track.duration || 120;

      if ((track.audioSrc || track.isCustom) && customAudioElem.src) {
        currentTime = customAudioElem.currentTime;
      } else {
        currentTime += 0.25;
        if (currentTime >= dur) {
          if (isRepeat) {
            currentTime = 0;
          } else {
            goRelative(1);
            return;
          }
        }
      }

      const pct = Math.min(100, (currentTime / dur) * 100);
      seekFill.style.width = `${pct}%`;
      seekBar.setAttribute('aria-valuenow', Math.round(pct));
      timeCurrent.textContent = fmtTime(currentTime);

      updateLyrics(currentTime);
    }, 200);
  }

  function stopProgressTimer() {
    if (trackTimer) {
      clearInterval(trackTimer);
      trackTimer = null;
    }
  }

  function goRelative(delta) {
    let next;
    if (isShuffle) {
      next = Math.floor(Math.random() * TRACKS.length);
    } else {
      next = (currentTrackIdx + delta + TRACKS.length) % TRACKS.length;
    }
    loadTrack(next, true);
  }

  function switchStage(stageName) {
    activeStage = stageName;
    stageTabs.forEach(btn => {
      btn.classList.toggle('active', btn.dataset.stage === stageName);
    });
    renderHeroArt();
  }

  stageTabs.forEach(btn => {
    btn.addEventListener('click', () => {
      switchStage(btn.dataset.stage);
    });
  });

  playBtn.addEventListener('click', togglePlay);
  nextBtn.addEventListener('click', () => goRelative(1));
  prevBtn.addEventListener('click', () => goRelative(-1));

  shuffleBtn.addEventListener('click', () => {
    isShuffle = !isShuffle;
    shuffleBtn.classList.toggle('active', isShuffle);
    shuffleBtn.setAttribute('aria-pressed', String(isShuffle));
  });

  repeatBtn.addEventListener('click', () => {
    isRepeat = !isRepeat;
    repeatBtn.classList.toggle('active', isRepeat);
    repeatBtn.setAttribute('aria-pressed', String(isRepeat));
  });

  function updateVolume(val) {
    volume = val;
    isMuted = false;
    if (gainNode && audioCtx) {
      gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
    }
    customAudioElem.volume = volume;
    volumeSlider.value = Math.round(volume * 100);
    updateSpeakerUI();
  }

  volumeSlider.addEventListener('input', (e) => {
    updateVolume(e.target.value / 100);
  });

  muteBtn.addEventListener('click', () => {
    isMuted = !isMuted;
    if (isMuted) {
      if (gainNode && audioCtx) gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
      customAudioElem.volume = 0;
    } else {
      if (gainNode && audioCtx) gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
      customAudioElem.volume = volume;
    }
    updateSpeakerUI();
  });

  seekBar.addEventListener('click', (e) => {
    const rect = seekBar.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    const track = TRACKS[currentTrackIdx];
    const dur = track.duration || 120;
    currentTime = ratio * dur;
    const pct = ratio * 100;
    seekFill.style.width = `${pct}%`;
    seekBar.setAttribute('aria-valuenow', Math.round(pct));
    timeCurrent.textContent = fmtTime(currentTime);

    if ((track.audioSrc || track.isCustom) && customAudioElem.src) {
      customAudioElem.currentTime = currentTime;
    }
    updateLyrics(currentTime);
  });

  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') {
      e.preventDefault();
      togglePlay();
    } else if (e.code === 'ArrowRight') {
      e.preventDefault();
      goRelative(1);
    } else if (e.code === 'ArrowLeft') {
      e.preventDefault();
      goRelative(-1);
    } else if (e.key === 's' || e.key === 'S') {
      shuffleBtn.click();
    } else if (e.key === 'r' || e.key === 'R') {
      repeatBtn.click();
    } else if (e.key === 'm' || e.key === 'M') {
      muteBtn.click();
    }
  });

  openSheetBtn.addEventListener('click', () => {
    sheetModal.classList.add('open');
  });
  closeSheetBtn.addEventListener('click', () => {
    sheetModal.classList.remove('open');
  });
  sheetModal.addEventListener('click', (e) => {
    if (e.target === sheetModal) sheetModal.classList.remove('open');
  });

  // Initial Boot
  setBgMode('treehouse');
  renderHeroArt();
  updatePlayButtonUI();
  updateSpeakerUI();
  renderPlaylist();
  loadTrack(0, false);
})();
</script>
</body>
</html>
